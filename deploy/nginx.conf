# 网页容器的 Nginx 配置：托管 web/dist，并把 /api/ 原路径转发给 api 容器。
# 域名校验由后端按 APP_ORIGIN 强制，所以这里用 server_name _ 即可，不需要写死域名。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 构建产物带内容指纹，可以长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/ 必须保持原路径转发：后端路由都挂在 /api/ 下（结尾不写斜杠）。
    # 通过变量 + Docker 内置 DNS 解析，api 容器重建换了地址后不需要重启本容器。
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 追加而不是覆盖：前面还有一层反代（例如 Caddy）时，后端需要看到完整链路，
        # 否则按 IP 限流会把所有人算成同一个地址。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
