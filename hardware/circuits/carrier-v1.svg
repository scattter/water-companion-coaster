<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1440" viewBox="0 0 1720 1440" role="img" aria-labelledby="title desc">
<title id="title">杯垫底板 v1 电气连接设计</title>
<desc id="desc">复用开发板 Type-C，用 MCP73831 以约 0.5 A 充电，用 CE 接 USB 5 V 的 LM66100 隔离原板充电器。HX711 为四针 2.54 mm 接口。</desc>
